[project]
name = "warband-mcp"
version = "0.1.0"
description = "Warband MCP tools backed by game scripts and an HTTP bridge"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2"]

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
