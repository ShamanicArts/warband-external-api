[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "warband-agentic-kit"
version = "0.2.0"
description = "Provider-neutral agentic modding and scripting kit for Warband"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2"]

[project.scripts]
warband-mcp = "src.warband_mcp:main"
warband-game-bridge = "bridge.game_bridge:main"
warband-agent-host = "bridge.agent_host:main"
warband-build-module = "module_system.build_mcp_module:main"
warband-voice = "warband_agentic.voice_server:main"
warband-agent-usability = "warband_agentic.usability_cli:main"
warband-benchmark = "bridge.benchmark_plan:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bridge*", "module_system*", "src*", "warband_agentic*"]
namespaces = true

[tool.setuptools.data-files]
"share/warband-agentic-kit/examples" = ["config/*.example.json"]

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
